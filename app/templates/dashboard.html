{% extends "base.html" %}
{% block title %}Живая статистика{% endblock %}
{% block content %}
<h1>Живая статистика <span id="updated" class="muted"></span></h1>

<div class="tiles" id="tiles"></div>

<div class="cols">
    <section class="panel"><h2>Партии по статусам</h2><canvas id="statusChart"></canvas></section>
    <section class="panel"><h2>Приёмка и отгрузка по дням (30 дн., шт.)</h2><canvas id="flowChart"></canvas></section>
</div>
<div class="cols">
    <section class="panel"><h2>По изделиям</h2>
        <table id="productTable">
            <thead><tr><th>Изделие</th><th>Актов</th><th>Кол-во</th><th>В рем.</th><th>Отгружено</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>
    <section class="panel"><h2>Последние события</h2><ul id="recent" class="timeline"></ul></section>
</div>

<script src="/static/chart.umd.js"></script>
<script src="/static/dashboard.js"></script>
{% endblock %}
